<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <script>
      // self-heal: if any old build left a service worker or CacheStorage
      // shell behind, evict it BEFORE the app loads (never show stale UI)
      try {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) {
            ks.forEach(function (k) { caches.delete(k); });
          });
        }
      } catch (e) {}
    </script>
    <script>
      // apply saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem("fm_theme");
        var bar = { ivory: "#070b10", navy: "#08111a", onyx: "#05070a", slate: "#101820" };
        if (t && bar[t]) {
          if (t !== "ivory") document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", bar[t]);
        }
      } catch (e) {}
    </script>
    <meta name="description" content="ForexMind AI - your personal AI trading research agent. Signals, learning and scientific strategy experiments." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ForexMind AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
