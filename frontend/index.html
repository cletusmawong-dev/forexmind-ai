<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e3" />
    <script>
      // apply saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem("fm_theme");
        if (t === "navy" || t === "onyx") {
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "navy" ? "#cdd4e0" : "#0a0a0c");
        }
      } catch (e) {}
    </script>
    <meta name="description" content="ForexMind AI - your personal AI trading research agent. Signals, learning and scientific strategy experiments." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ForexMind AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
