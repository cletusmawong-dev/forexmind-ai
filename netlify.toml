# Root Netlify config (monorepo): the frontend lives in frontend/.
# Linking this repo once in the Netlify UI is enough - no manual build settings,
# no access tokens. Netlify reads this file and deploys main automatically.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

# Proxy API calls to the always-on FastAPI backend (same origin, no CORS).
[[redirects]]
  from = "/api/*"
  to = "https://forexmind-ai-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback - client-side routes render index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
