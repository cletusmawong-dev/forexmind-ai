name: FOREXMIND AI - Android build

# Final master build (section 39/56): official APK + AAB for the existing
# FOREXMIND web app via Capacitor. One backend, zero duplicated logic.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/android-build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Web build (same bundle as production web)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Gradle build (debug APK + signed release APK + AAB)
        working-directory: frontend/android
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          # ephemeral release key for installable distribution builds;
          # Play Store release will use Play App Signing instead.
          keytool -genkeypair -v -keystore app/fxm-release.keystore -alias fxm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass forexmind-release -keypass forexmind-release \
            -dname "CN=FOREXMIND AI, O=ForexMind, C=GH"
          cat > keystore.properties << 'PROPS'
          storeFile=fxm-release.keystore
          storePassword=forexmind-release
          keyAlias=fxm
          keyPassword=forexmind-release
          PROPS
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Upload APKs and AAB
        uses: actions/upload-artifact@v4
        with:
          name: forexmind-android
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
